version: '3.8'

services:
  # Django Application Service (Gunicorn WSGI)
  web:
    build: .
    container_name: django_web
    restart: always
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    expose:
      - "8000"
    depends_on:
      - redis
      - rabbitmq

  # Celery Worker Service for background task processing
  celery_worker:
    build: .
    container_name: celery_worker
    restart: always
    command: celery -A core worker -l info -E
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=${REDIS_URL}
    hostname: worker-1
    depends_on:
      - web
      - redis
      - rabbitmq

  # Nginx Reverse Proxy Service
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  # Redis Service (Caching and optional broker)
  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"

  # RabbitMQ Service (Message Broker for Celery)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    restart: always
    env_file:
      - .env
    ports:
      - "5672:5672"   # AMQP protocol port for apps
      - "15672:15672" # Management UI web port
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}

  # Flower Web UI for Celery Monitoring
  flower:
    image: mher/flower:latest
    container_name: celery_flower
    restart: always
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - rabbitmq
      - celery_worker